name: Build and release theme

# Runs on every push to main (i.e. every merged PR). Releases only when the
# Version header in style.css has been bumped to a version that has no tag yet:
#
#   - version unchanged (already tagged)   -> skip, no release
#   - version bumped above the latest tag  -> build, tag, release
#   - version untagged but not the highest -> fail
#
# The release gets a zip of the theme with compiled assets and dev-only
# files stripped out.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # needed for tags

      - name: Decide whether to release
        id: version
        run: |
          VERSION=$(grep -m1 -oP '^Version:\s*\K\S+' style.css)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version header '$VERSION' in style.css is not in X.Y.Z format."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version $VERSION is lower than the latest tag $LATEST. Bump the Version header in style.css above $LATEST."
              exit 1
            fi
          fi

          echo "Releasing $VERSION (previous: ${LATEST:-none})."
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Node 22 ships npm 10; match the npm 11 that writes package-lock.json.
      - name: Use npm 11
        if: steps.version.outputs.release == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build assets
        if: steps.version.outputs.release == 'true'
        run: npm run build

      - name: Assemble release package
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_DIR="dist-release/govwind"
          mkdir -p "$PKG_DIR"
          cp style.css functions.php theme.json composer.json README.md "$PKG_DIR/"
          cp -R inc parts patterns styles templates "$PKG_DIR/"
          # assets/css is Sass source compiled into dist/; images and JS are loaded directly.
          mkdir -p "$PKG_DIR/assets"
          cp -R assets/images assets/js "$PKG_DIR/assets/"
          # dist/theme.css is inlined into dist/style.css by the build, so only
          # style.css and the font files it references are needed.
          mkdir -p "$PKG_DIR/dist"
          cp -R dist/style.css dist/files "$PKG_DIR/dist/"
          (cd dist-release && zip -rq "../govwind-${VERSION}.zip" govwind)
          unzip -l "govwind-${VERSION}.zip" | tail -n1

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: govwind-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
